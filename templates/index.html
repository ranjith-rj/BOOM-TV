<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GTV IPTV Player</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5v-.7zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.8 8.8 0 0 0 21 12c0-4.3-3-7.9-7-8.8v2.1c2.9.9 5 3.6 5 6.7zM4.3 3L3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3L4.3 3zM12 4L9.9 6.1 12 8.2V4z"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="" width="30" height="30">
      <h1>BOOM TV </span></h1>
    </div>
    <div class="topbar-right">
      <label class="switch" title="Route streams through this server (fixes CORS / mixed-network problems)">
        <input type="checkbox" id="proxyToggle">
        <span>Use proxy</span>
      </label>
      <button class="btn" id="refreshBtn" type="button" title="Reload channel list from the IPTV server">
        <svg class="i"><use href="#i-reload"/></svg><span>Refresh</span>
      </button>
      <div class="pill" id="serverStatus" data-state="checking" title="Server status"><i></i><span>Checking…</span></div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Search channels or categories…" autocomplete="off" aria-label="Search channels">
      </div>
      <div class="filters">
        <select id="categorySelect" aria-label="Filter by category"><option value="all">All categories</option></select>
        <span id="countLabel" class="count"></span>
      </div>
      <div class="list-wrap">
        <div id="channelList" class="channel-list" role="list"></div>
        <div id="listState" class="list-state" hidden></div>
      </div>
    </aside>

    <section class="stage">
      <div class="player" id="playerWrap">
        <video id="video" playsinline></video>

        <div class="overlay" id="overlay" data-mode="idle">
          <div class="spinner"></div>
          <p id="overlayText">Select a channel to start watching</p>
          <button class="btn primary" id="overlayBtn" type="button" hidden>Retry</button>
        </div>

        <div class="controls" id="controls">
          <button class="icon-btn" id="prevBtn" type="button" title="Previous channel (↑)"><svg class="i"><use href="#i-prev"/></svg></button>
          <button class="icon-btn" id="playBtn" type="button" title="Play / Pause (Space)"><svg class="i"><use href="#i-play"/></svg></button>
          <button class="icon-btn" id="nextBtn" type="button" title="Next channel (↓)"><svg class="i"><use href="#i-next"/></svg></button>
          <button class="icon-btn" id="muteBtn" type="button" title="Mute (M)"><svg class="i"><use href="#i-volume"/></svg></button>
          <input id="volume" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume">
          <span class="spacer"></span>
          <button class="icon-btn" id="reloadBtn" type="button" title="Reload stream"><svg class="i"><use href="#i-reload"/></svg></button>
          <button class="icon-btn" id="fsBtn" type="button" title="Fullscreen (F)"><svg class="i"><use href="#i-full"/></svg></button>
        </div>
      </div>

      <div class="now-playing">
        <img id="npLogo" alt="" hidden>
        <div>
          <h2 id="npName">No channel selected</h2>
          <p id="npGroup">Pick a channel from the list</p>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- hls.js: CDN first, local copy (static/js/hls.min.js) as offline fallback -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"
          onerror="this.onerror=null;var s=document.createElement('script');s.src='{{ url_for('static', filename='js/hls.min.js') }}'; document.head.appendChild(s);"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script> -->
  <!-- hls.js: CDN first, local copy as offline fallback -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
  if (!window.Hls) {
    document.write('<script src="{{ url_for("static", filename="js/hls.min.js") }}"><\/script>');
  }
</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
